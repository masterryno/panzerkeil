# Netlify: a static site served straight from the repository root, no build step.
[build]
  publish = "."
  command = ""

# panzerkeil.app is the address; the .com (a domain alias) sends everyone there.
# Netlify upgrades http to https first, so the https forms cover every visit.
[[redirects]]
  from = "https://panzerkeil.com/*"
  to = "https://panzerkeil.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.panzerkeil.com/*"
  to = "https://panzerkeil.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
